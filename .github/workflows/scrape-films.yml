name: Scrape Films

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */5 * *" # Runs every 5 days at midnight UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile || yarn --no-package-lock

      - name: Scrape films
        run: yarn scrape-films

      - name: Enrich Letterboxd IDs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: yarn enrich-letterboxd --apply --delay=400

      - name: Enrich Letterboxd ratings
        run: yarn enrich-letterboxd-stats --apply --delay=400

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes if any
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add src/data/movies.json
          git commit -m "github-bot: scrape films and enrich letterboxd"
          git push
